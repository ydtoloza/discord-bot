services:
  discord-bot:
    build: .
    container_name: discord-arr-bot
    restart: unless-stopped
    ports:
      - "5002:5001"
    env_file:
      - .env
    volumes:
      - ./data:/usr/src/app/data
    environment:
      - PORT=5001
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your-webhook-id/your-webhook-token
      # - TMDB_API_KEY=your-tmdb-api-key # Opcional, descomentar si se usa
